trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/**
      - pipelines/ci-build.yml

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: 'acrazuredevopsbuildmg'
  imageName: 'azure-devops-build-app'
  trivyVersion: '0.74.0'

steps:
- script: |
    npx --yes html-validate@11.6.2 app/index.html
  displayName: 'HTML validation'

- script: |
    npx --yes linkinator@7.6.1 app/index.html
  displayName: 'Broken link check'

- script: |
    npx --yes @lhci/cli@0.15.1 autorun
  displayName: 'Lighthouse CI'

- script: |
    SHORT_SHA=$(git rev-parse --short HEAD)
    echo "##vso[task.setvariable variable=imageTag]$SHORT_SHA"
  displayName: 'Compute image tag'

- script: |
    IMAGE="$(acrName).azurecr.io/$(imageName)"
    docker build -t "$IMAGE:$(imageTag)" -t "$IMAGE:latest" ./app
  displayName: 'Build image'

- script: |
    curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v$(trivyVersion)
    IMAGE="$(acrName).azurecr.io/$(imageName)"
    trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress "$IMAGE:$(imageTag)"
  displayName: 'Trivy vulnerability scan'

- task: AzureCLI@2
  displayName: 'Push image to ACR'
  inputs:
    azureSubscription: 'sc-azure-devops-build'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e
      IMAGE="$(acrName).azurecr.io/$(imageName)"
      az acr login --name $(acrName)
      docker push "$IMAGE:$(imageTag)"
      docker push "$IMAGE:latest"